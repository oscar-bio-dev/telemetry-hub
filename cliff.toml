# git-cliff ~ configuration file for telemetry-hub
# EcoWest Instrument - Automated Conventional Changelog Generator
# https://git-cliff.org/docs/configuration

[changelog]
# Template for the changelog header
header = """
# Changelog

All notable changes to the **Ecological Telemetry Hub** (`telemetry-hub`) are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)
and [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).

"""
# Template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.github.username %} by @{{ commit.github.username }}{%- endif %}\
            {% if commit.github.pr_number %} in #{{ commit.github.pr_number }}{%- endif %}\
    {% endfor %}
{% endfor %}\n
"""
# Template for the changelog footer
footer = """
<!-- Generated by git-cliff -->
"""
# Remove leading and trailing whitespace
trim = true

[git]
# Parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# Filter out the commits that are not conventional
filter_unconventional = false
# Process each line of a commit as an individual commit
split_commits = false

# Regex for preprocessing the commit messages
commit_preprocessors = [
    # Replace issue numbers with markdown links
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/oscar-bio-dev/telemetry-hub/issues/${2}))" },
    # Clean up trailing whitespace
    { pattern = '\s+$', replace = "" },
]

# Regex for parsing and grouping commits
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^doc", group = "<!-- 2 -->📚 Documentation" },
    { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 4 -->🚜 Refactor" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling & Design" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    { message = "^security", group = "<!-- 7 -->🛡️ Security" },
    { message = "^ci", group = "<!-- 8 -->⚙️ Continuous Integration" },
    { message = "^build", group = "<!-- 9 -->📦 Build System" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps.*\\)", group = "<!-- 10 -->🔩 Dependencies" },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^chore", group = "<!-- 11 -->🧹 Miscellaneous Tasks" },
    { message = "^revert", group = "<!-- 12 -->◀️ Revert" },
]

# Protect breaking changes from being skipped
protect_breaking_commits = false
# Filter out commits outside tags
filter_commits = false
# Regex for matching git tags
tag_pattern = "v?[0-9].*"
# Regex for skipping tags
skip_tags = ""
# Regex for ignoring tags
ignore_tags = ""
# Sort the tags chronologically
date_order = false
# Sort the commits inside sections by oldest/newest
sort_commits = "oldest"

[remote.github]
owner = "oscar-bio-dev"
repo = "telemetry-hub"
